<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- E233系風 — 銀ボディ＋青帯 -->
  <g>
    <!-- 車体 -->
    <rect x="8" y="28" width="64" height="28" rx="5" fill="#d8d8d8" stroke="#888" stroke-width="1.5"/>
    <!-- 青帯 -->
    <rect x="8" y="44" width="64" height="5" fill="#2060b0"/>
    <!-- 前面 -->
    <rect x="68" y="30" width="6" height="24" rx="2" fill="#d0d0d0" stroke="#888" stroke-width="1"/>
    <!-- 窓 -->
    <rect x="14" y="32" width="8" height="8" rx="1.5" fill="#80b0e0"/>
    <rect x="26" y="32" width="8" height="8" rx="1.5" fill="#80b0e0"/>
    <rect x="38" y="32" width="8" height="8" rx="1.5" fill="#80b0e0"/>
    <rect x="50" y="32" width="8" height="8" rx="1.5" fill="#80b0e0"/>
    <!-- ドア -->
    <rect x="23" y="30" width="6" height="18" rx="1" fill="#c0c0c0" stroke="#999" stroke-width="0.8"/>
    <rect x="47" y="30" width="6" height="18" rx="1" fill="#c0c0c0" stroke="#999" stroke-width="0.8"/>
    <!-- 車輪 -->
    <circle cx="22" cy="58" r="4" fill="#555"/>
    <circle cx="58" cy="58" r="4" fill="#555"/>
    <!-- レール -->
    <rect x="4" y="60" width="72" height="3" rx="1" fill="#888"/>
