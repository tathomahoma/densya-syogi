<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- E353系あずさ風 — 白ボディ＋紫＋黄ライン -->
  <g>
    <!-- 車体 -->
    <rect x="8" y="28" width="64" height="28" rx="6" fill="#f0f0f0" stroke="#5040a0" stroke-width="2"/>
    <!-- 紫ライン -->
    <rect x="8" y="42" width="64" height="5" fill="#6050b0"/>
    <!-- 黄色アクセント -->
    <rect x="8" y="47" width="64" height="2" fill="#e0c020"/>
    <!-- 前面 -->
    <path d="M72,28 Q78,42 72,56" fill="#f0f0f0" stroke="#5040a0" stroke-width="1.5"/>
    <!-- 窓 -->
    <rect x="16" y="32" width="10" height="7" rx="2" fill="#a080d0"/>
    <rect x="30" y="32" width="10" height="7" rx="2" fill="#a080d0"/>
    <rect x="44" y="32" width="10" height="7" rx="2" fill="#a080d0"/>
    <!-- 前面窓 -->
    <rect x="60" y="33" width="10" height="8" rx="2" fill="#9070c0" stroke="#5040a0" stroke-width="1"/>
    <!-- ヘッドライト -->
    <circle cx="74" cy="34" r="2" fill="#ffe040"/>
    <!-- 車輪 -->
    <circle cx="22" cy="58" r="4" fill="#555"/>
    <circle cx="58" cy="58" r="4" fill="#555"/>
    <!-- レール -->
    <rect x="4" y="60" width="72" height="3" rx="1" fill="#888"/>
  </g>
</svg>
