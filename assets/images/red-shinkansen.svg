<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- N700系のぞみ風 — 白ボディ＋青ライン -->
  <g>
    <!-- 車体 -->
    <rect x="8" y="28" width="64" height="28" rx="6" fill="#f0f0f0" stroke="#4060a0" stroke-width="2"/>
    <!-- 青ライン -->
    <rect x="8" y="40" width="64" height="6" fill="#3050a0"/>
    <!-- 先頭のノーズ -->
    <polygon points="72,32 80,42 72,52" fill="#f0f0f0" stroke="#4060a0" stroke-width="1.5"/>
    <!-- 窓 -->
    <rect x="16" y="32" width="8" height="6" rx="1" fill="#80b0e0"/>
    <rect x="28" y="32" width="8" height="6" rx="1" fill="#80b0e0"/>
    <rect x="40" y="32" width="8" height="6" rx="1" fill="#80b0e0"/>
    <rect x="52" y="32" width="8" height="6" rx="1" fill="#80b0e0"/>
    <!-- 先頭窓 -->
    <polygon points="64,33 71,38 71,46 64,51" fill="#6090c0" stroke="#4060a0" stroke-width="1"/>
    <!-- 車輪 -->
    <circle cx="22" cy="58" r="4" fill="#555"/>
    <circle cx="58" cy="58" r="4" fill="#555"/>
    <!-- レール -->
    <rect x="4" y="60" width="72" height="3" rx="1" fill="#888"/>
  </g>
</svg>
